name: Build and push course image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .devcontainer/**
      - .github/workflows/build-image.yml
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (e.g. 2026a, 2026a.2)"
        required: true
        default: "2026a"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install devcontainer CLI
        run: npm install -g @devcontainers/cli

      - name: Resolve tag
        id: tag
        run: echo "tag=${{ github.event.inputs.tag || '2026a' }}" >> "$GITHUB_OUTPUT"

      # Use the devcontainer CLI (not a bare `docker build`) so that
      # "features" declared in .devcontainer/devcontainer.json (desktop-lite)
      # are actually installed into the pushed image, rather than only
      # working when a dev container is freshly created from source.
      - name: Build and push (multi-arch)
        run: |
          devcontainer build \
            --workspace-folder . \
            --platform linux/amd64,linux/arm64 \
            --image-name ghcr.io/paradigmas-udesa/paradigmas:${{ steps.tag.outputs.tag }} \
            --push

      # Never move `latest` mid-semester onto a tag students already have --
      # see the tag-discipline note in the repo README. This step only runs
      # for the default course-edition tag on an explicit dispatch.
      - name: Also tag latest
        if: steps.tag.outputs.tag == '2026a'
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/paradigmas-udesa/paradigmas:latest \
            ghcr.io/paradigmas-udesa/paradigmas:${{ steps.tag.outputs.tag }}
