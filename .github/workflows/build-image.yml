name: Build and push course image

# Student-facing tags are published ONLY by an explicit workflow_dispatch.
# A push to main republishes the throwaway `edge` tag instead, which proves
# the image still builds (the SFML patch greps in particular) without ever
# moving a tag a student may already have pulled -- see the tag-discipline
# note in the repo README.
on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .devcontainer/**
      - .github/workflows/build-image.yml
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (e.g. 2026a, 2026a.2)"
        required: true
        default: "2026a"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install devcontainer CLI
        run: npm install -g @devcontainers/cli

      # Inputs are read via env rather than interpolated into the script body,
      # so a tag string can never be evaluated as shell.
      - name: Resolve tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
          else
            tag="edge"
          fi
          echo "Publishing tag: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # Use the devcontainer CLI (not a bare `docker build`) so that
      # "features" declared in .devcontainer/devcontainer.json (desktop-lite)
      # are actually installed into the pushed image, rather than only
      # working when a dev container is freshly created from source.
      - name: Build and push (multi-arch)
        run: |
          devcontainer build \
            --workspace-folder . \
            --platform linux/amd64,linux/arm64 \
            --image-name ghcr.io/paradigmas-udesa/paradigmas:${{ steps.tag.outputs.tag }} \
            --push

      # Never move `latest` mid-semester onto a tag students already have --
      # see the tag-discipline note in the repo README. Both conditions are
      # required: the event check keeps a push to main from moving `latest`,
      # and the tag check keeps a mid-semester `2026a.2` dispatch from doing
      # so either.
      - name: Also tag latest
        if: github.event_name == 'workflow_dispatch' && steps.tag.outputs.tag == '2026a'
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/paradigmas-udesa/paradigmas:latest \
            ghcr.io/paradigmas-udesa/paradigmas:${{ steps.tag.outputs.tag }}
